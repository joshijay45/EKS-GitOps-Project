apiVersion: apps/v1
kind: Deployment 
metadata:
  name: simple-app-deploy
  namespace: default

spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-app
  template:
    metadata:
      labels:
        app: simple-app
    spec:
      containers:
      - name: simple-app
        image: 102268067814.dkr.ecr.us-east-1.amazonaws.com/simple-flask-app-repo
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"