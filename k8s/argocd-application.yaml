apiVerison: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-app-argo
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/joshijay45/EKS-GitOps-Project.git
    targetRevision: main
    path: k8s
  destination:
    server:
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true